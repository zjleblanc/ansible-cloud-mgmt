---
argument_specs:
  main:
    short_description: Install and configure a Valkey server
    description:
      - Installs Valkey from the RHEL AppStream repository and configures
        the bind address, port, and memory limits.
    author:
      - Zach LeBlanc
    options:
      valkey_bind:
        type: str
        required: false
        default: "127.0.0.1"
        description: Interface address Valkey binds to.
      valkey_port:
        type: int
        required: false
        default: 6379
        description: TCP port Valkey listens on.
      valkey_maxmemory:
        type: str
        required: false
        default: "256mb"
        description: >-
          Maximum memory Valkey may use (e.g. 256mb, 1gb). Set to "0" for
          no limit.
      valkey_maxmemory_policy:
        type: str
        required: false
        default: "noeviction"
        choices:
          - noeviction
          - allkeys-lru
          - volatile-lru
          - allkeys-random
          - volatile-random
          - volatile-ttl
        description: Key eviction policy applied once maxmemory is reached.
      valkey_manage_firewall:
        type: bool
        required: false
        default: true
        description: >-
          Whether to enable firewalld and open the configured valkey_port
          over TCP.
