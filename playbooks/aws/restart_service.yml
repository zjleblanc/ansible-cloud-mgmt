---
- name: Restart a service on an EC2 instance
  hosts: localhost
  gather_facts: false
  tags: restart_service

  environment:
    AWS_REGION: "{{ _aws_region | default('us-east-2') }}"

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - _host is defined
          - service_name is defined
        fail_msg: >-
          _host and service_name must be provided to restart a service.

    - name: Warn that ITSM tracking will be skipped
      when: ritm_number is not defined
      ansible.builtin.debug:
        msg: >-
          ritm_number was not provided; SC Task creation and ITSM tracking steps
          will be skipped for this run.

    - name: Manage SC Task tracking for this request
      when: ritm_number is defined
      tags: snow
      block:
        - name: Get RITM record to determine associated REQ
          register: r_ritm_info
          servicenow.itsm.api_info:
            resource: sc_req_item
            sysparm_query: "sys_id={{ ritm_sys_id }}"

        - name: Create SC Task linked to the RITM and REQ
          register: r_sc_task_create
          servicenow.itsm.api:
            resource: sc_task
            action: post
            data:
              request: "{{ r_ritm_info.record[0].request }}"
              request_item: "{{ ritm_sys_id }}"
              short_description: "Service restart ({{ service_name }}) for {{ _host }}"
              state: "2" # Work in Progress
              assigned_to: "{{ sc_task_assigned_to | default(omit) }}"

        - name: Save SC Task sys_id for later updates
          ansible.builtin.set_fact:
            sc_task_sys_id: "{{ r_sc_task_create.record.sys_id }}"

    - name: Gather information about a particular instance using ID
      register: r_instance_info
      amazon.aws.ec2_instance_info:
        filters:
          tag:Name: "{{ _host }}"
          instance-state-name: ["running"]

    - name: Determine platform
      ansible.builtin.set_fact:
        host_platform: "{{ hostvars[_host]['platform_details'] | default('unknown') | lower }}"

    - name: Add target host | RHEL
      when: host_platform is search('red hat')
      ansible.builtin.add_host:
        name: ec2_restart_target
        ansible_host: "{{ r_instance_info['instances'][0]['public_ip_address'] }}"
        service_name: "{{ service_name }}"
        host_platform: "{{ host_platform }}"
        sc_task_sys_id: "{{ sc_task_sys_id | default(omit) }}"

    - name: Add target host | Windows
      when: host_platform is search('windows')
      ansible.builtin.add_host:
        name: ec2_restart_target
        ansible_host: "{{ r_instance_info['instances'][0]['public_ip_address'] }}"
        service_name: "{{ service_name }}"
        host_platform: "{{ host_platform }}"
        sc_task_sys_id: "{{ sc_task_sys_id | default(omit) }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: credssp
        ansible_winrm_server_cert_validation: ignore

- name: Restart the target service
  hosts: ec2_restart_target
  gather_facts: false
  tags: restart_service

  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        timeout: "{{ connection_timeout | default(120) }}"

    - name: Check service status before restart | RHEL
      when: host_platform is search('red hat')
      become: true
      register: r_pre_check_rhel
      ansible.builtin.systemd:
        name: "{{ service_name }}"

    - name: Check service status before restart | Windows
      when: host_platform is search('windows')
      register: r_pre_check_windows
      ansible.windows.win_service_info:
        name: "{{ service_name }}"

    - name: Add pre-restart status to SC Task | RHEL
      when:
        - sc_task_sys_id is defined
        - host_platform is search('red hat')
      tags: snow
      delegate_to: localhost
      servicenow.itsm.api:
        resource: sc_task
        action: patch
        sys_id: "{{ sc_task_sys_id }}"
        data:
          work_notes: >-
            Pre-restart status of {{ service_name }} on {{ _host }}:
            ActiveState={{ r_pre_check_rhel.status.ActiveState }},
            SubState={{ r_pre_check_rhel.status.SubState }}.

    - name: Add pre-restart status to SC Task | Windows
      when:
        - sc_task_sys_id is defined
        - host_platform is search('windows')
      tags: snow
      delegate_to: localhost
      servicenow.itsm.api:
        resource: sc_task
        action: patch
        sys_id: "{{ sc_task_sys_id }}"
        data:
          work_notes: >-
            Pre-restart status of {{ service_name }} on {{ _host }}:
            state={{ r_pre_check_windows.services[0].state }}.

    - name: Restart service | RHEL
      when: host_platform is search('red hat')
      become: true
      register: r_restart_rhel
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted

    - name: Restart service | Windows
      when: host_platform is search('windows')
      register: r_restart_windows
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: restarted

    - name: Verify service is running | RHEL
      when: host_platform is search('red hat')
      become: true
      register: r_verify_rhel
      ansible.builtin.systemd:
        name: "{{ service_name }}"

    - name: Assert service is active | RHEL
      when: host_platform is search('red hat')
      ansible.builtin.assert:
        that:
          - r_verify_rhel.status.ActiveState == 'active'
        fail_msg: "Service {{ service_name }} is not active after restart on {{ _host }}."

    - name: Verify service is running | Windows
      when: host_platform is search('windows')
      register: r_verify_windows
      ansible.windows.win_service_info:
        name: "{{ service_name }}"

    - name: Assert service is running | Windows
      when: host_platform is search('windows')
      ansible.builtin.assert:
        that:
          - r_verify_windows.services[0].state == 'running'
        fail_msg: "Service {{ service_name }} is not running after restart on {{ _host }}."

    - name: Add post-restart status to SC Task | RHEL
      when:
        - sc_task_sys_id is defined
        - host_platform is search('red hat')
      tags: snow
      delegate_to: localhost
      servicenow.itsm.api:
        resource: sc_task
        action: patch
        sys_id: "{{ sc_task_sys_id }}"
        data:
          work_notes: >-
            Post-restart status of {{ service_name }} on {{ _host }}:
            ActiveState={{ r_verify_rhel.status.ActiveState }},
            SubState={{ r_verify_rhel.status.SubState }}.

    - name: Add post-restart status to SC Task | Windows
      when:
        - sc_task_sys_id is defined
        - host_platform is search('windows')
      tags: snow
      delegate_to: localhost
      servicenow.itsm.api:
        resource: sc_task
        action: patch
        sys_id: "{{ sc_task_sys_id }}"
        data:
          work_notes: >-
            Post-restart status of {{ service_name }} on {{ _host }}:
            state={{ r_verify_windows.services[0].state }}.

    - name: Update SC Task with restart results
      when: sc_task_sys_id is defined
      tags: snow
      block:
        - name: Close SC Task
          delegate_to: localhost
          servicenow.itsm.api:
            resource: sc_task
            action: patch
            sys_id: "{{ sc_task_sys_id }}"
            data:
              state: "3" # Closed Complete
              work_notes: "Service {{ service_name }} restarted successfully on {{ _host }} by Ansible."

        - name: Set state to closed
          ansible.builtin.set_stats:
            data:
              sc_task_state: closed
              close_notes: "Service {{ service_name }} restart completed successfully."
