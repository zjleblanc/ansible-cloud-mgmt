---
ansible-navigator:
  ansible:
    inventory:
      help: false
      # entries:
      #   - inventories/aws/amazon.aws.aws_ec2.yaml
  execution-environment:
    container-engine: docker
    image: quay.io/zleblanc/ee-default:latest
    environment-variables:
      pass:
        - AWS_ACCESS_KEY
        - AWS_SECRET_KEY
        - AWS_REGION
        - VMWARE_HOST
        - VMWARE_USER
        - VMWARE_PASSWORD
  playbook-artifact:
    enable: false
  logging:
    append: true
    file: ./ansible-navigator.log
    level: warning
